name: Timetables

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: timetables

permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    working-directory: city

env:
  BRANCH: timetables/refresh
  ISSUE_TITLE: Prayer timetables need attention

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: city/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Refresh every timetable
        id: refresh
        run: |
          if npm run --silent timetables > "$RUNNER_TEMP/report.md"; then attention=false; else attention=true; fi
          echo "attention=$attention" >> "$GITHUB_OUTPUT"
          printf '\n[Run log](%s)\n' "$RUN_URL" >> "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          LONDON_PRAYER_TIMES_KEY: ${{ secrets.LONDON_PRAYER_TIMES_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Test the refreshed data
        id: test
        run: npm test

      # Pull requests opened with GITHUB_TOKEN start no workflows, so this one gets no preview; the
      # npm test above is its check. Merging it by hand deploys as usual.
      - name: Open a pull request for changed times
        run: |
          # Every run rewrites "retrieved", so only a change to the times is worth a pull request.
          if git diff --quiet -I '"retrieved": "' -- data/timetables; then
            echo "No published times changed."
            exit 0
          fi
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git diff --quiet -I '"retrieved": "' FETCH_HEAD -- data/timetables; then
            echo "$BRANCH already has these times."
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add data/timetables
          git commit --quiet --message "Timetables: refresh from the published sources"
          # Recreated, not force-pushed: GITHUB_TOKEN can be refused a push that moves a branch across
          # workflow changes on main. Deleting the branch closes the older refresh pull request.
          git push --quiet origin --delete "$BRANCH" 2>/dev/null || true
          git push --quiet origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Timetables: refresh from the published sources" --body-file "$RUNNER_TEMP/report.md"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open, update or close the attention issue
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        run: |
          if [ "$TESTS" != success ]; then
            printf "\nnpm test failed on the refreshed data, so no pull request was opened.\n" >> "$RUNNER_TEMP/report.md"
            ATTENTION=true
          fi
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [ "$ATTENTION" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/report.md"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every script ran and no timetable runs out soon."
          fi
        env:
          ATTENTION: ${{ steps.refresh.outputs.attention }}
          TESTS: ${{ steps.test.outcome }}
          GH_TOKEN: ${{ github.token }}
