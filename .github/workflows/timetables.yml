name: Timetables

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: timetables

permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    working-directory: city

env:
  BRANCH: timetables/refresh
  ISSUE_TITLE: Prayer timetables need attention
  GH_TOKEN: ${{ github.token }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: city/package-lock.json
      - run: npm ci
      - run: sudo apt-get install --yes poppler-utils

      - name: Refresh every timetable
        id: refresh
        run: |
          if npm run --silent timetables > "$RUNNER_TEMP/report.md"; then attention=false; else attention=true; fi
          echo "attention=$attention" >> "$GITHUB_OUTPUT"
          printf '\n[Run log](%s)\n' "$RUN_URL" >> "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          LONDON_PRAYER_TIMES_KEY: ${{ secrets.LONDON_PRAYER_TIMES_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - run: npm test

      # Pull requests opened with GITHUB_TOKEN start no workflows, so this one gets no preview; the
      # npm test above is its check. Merging it by hand deploys as usual.
      - name: Open or update the refresh pull request
        run: |
          # Every run rewrites "retrieved", so only a change to the times is worth a pull request.
          if git diff --quiet -I '"retrieved": "' -- data/timetables; then
            echo "No published times changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add data/timetables
          git commit --quiet --message "Timetables: refresh from the published sources"
          git push --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Timetables: refresh from the published sources" --body-file "$RUNNER_TEMP/report.md"
          fi

      - name: Open, update or close the attention issue
        run: |
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$ATTENTION" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/report.md"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every script ran and no timetable runs out soon."
          fi
        env:
          ATTENTION: ${{ steps.refresh.outputs.attention }}
